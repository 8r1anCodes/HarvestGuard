{% extends "base.html" %}
{% block title %}Log in · ShambaShield AI{% endblock %}
{% block content %}
<main class="auth">
  <h1 data-sw="Ingia">Log in</h1>
  <p class="muted">Welcome back. Enter your phone number and password.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Phone number
      <input type="tel" name="phone" placeholder="0712345678" required autofocus></label>
    <label>Password
      <input type="password" name="password" required></label>
    <button class="btn btn-primary">Log in</button>
  </form>
  <p class="auth-note">New here? <a href="{{ url_for('register') }}">Create a farmer account</a></p>
  <div class="demo-box"><b>Demo account:</b> phone <code>0700000000</code>, password <code>demo1234</code></div>
</main>
{% endblock %}
